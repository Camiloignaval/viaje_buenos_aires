change: first-visible-experience
artifact_store: openspec
execution_mode: automatic
delivery_strategy: auto-chain
chain_strategy: feature-branch-chain
status: ready-for-apply
phases:
  explore: done
  proposal: done
  specs: done       # 19 scenarios
  design: done
  tasks: done       # strict TDD; 10 tasks across three review slices
  apply: pending    # 0/10 tasks complete
  verify: pending
  archive: pending
constraints:
  - preserve all five engines, Story, composer semantics and production routes except intended ActiveTripHome integration
  - no simulator production import, delivery, persistence, new authority, build or Playwright
  - use sequential local thematic commits with feature-branch-chain review boundaries
