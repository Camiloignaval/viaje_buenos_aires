change: first-visible-experience
artifact_store: openspec
execution_mode: automatic
delivery_strategy: auto-chain
chain_strategy: feature-branch-chain
status: ready-for-apply
phases:
  explore: done
  proposal: done
  specs: done        # consolidated evolution; 15 scenarios
  design: done       # companion experience closure
  tasks: done        # strict TDD; 10/19 complete across six review slices
  apply: pending     # closure tasks 11-19 remain
  verify: superseded # prior PASS belongs to the pre-closure baseline
  archive: pending
constraints:
  - preserve all five engines, Story, composer semantics and existing visible behavior
  - sessionStorage only; fail closed; visible receipts alone feed Companion history
  - no UI redesign unless a failing test proves an objective defect
  - no delivery execution, durable persistence, timers, build or Playwright
  - use sequential local thematic commits with feature-branch-chain review boundaries
